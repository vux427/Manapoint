[package]
name = "manapoint"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "AI 訂閱用量的桌面浮動面板"
default-run = "manapoint"

[lib]
name = "manapoint_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
reqwest = { version = "0.13.3", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.1", features = ["time", "sync"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

# 常駐小掛件：體積優先。LTO + 單一 codegen unit + panic=abort，
# 剝掉符號後可觀地縮小發布檔。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
