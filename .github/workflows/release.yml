name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tinyjs
        shell: pwsh
        run: |
          $env:TINYJS_VERSION = 'v0.50.1'
          Invoke-WebRequest https://tinyjs.app/install.ps1 -OutFile "$env:RUNNER_TEMP/tinyjs-install.ps1"
          & "$env:RUNNER_TEMP/tinyjs-install.ps1"
      - name: Test, build and package
        shell: pwsh
        run: |
          $version = (Get-Content manapoint/tinyjs.json -Raw | ConvertFrom-Json).version
          ./scripts/release.ps1 -NotesFile "docs/releases/v$version.md"
      - name: Upload and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content dist/manifest.json -Raw | ConvertFrom-Json
          $version = $manifest.version
          $tag = "v$version"
          $zip = "Manapoint-$version-win.zip"
          $notes = (Get-Content "docs/releases/$tag.md" -Raw -Encoding UTF8).Trim()
          $heading = ($notes -split "`n")[0].Trim()
          $title = if ($heading.StartsWith('# ')) { "$tag — $($heading.Substring(2))" } else { $tag }
          $notes += "`n`nSHA-256 ($zip): ``$($manifest.win.sha256)```n"
          [IO.File]::WriteAllText("dist/release-notes.md", $notes, [Text.UTF8Encoding]::new($false))
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title $title --notes-file dist/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag "dist/$zip" dist/manifest.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
